services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5672:5672"
      - "15672:15672"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    env_file:
      - .env
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outbox-worker
    env_file:
      - .env
    restart: always
    command: python src/outbox_worker.py
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consumer
    env_file:
      - .env
    restart: always
    command: python src/consumer.py
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  postgres_data:
